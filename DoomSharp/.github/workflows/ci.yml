name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    name: Build & Test (zero warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DoomSharp/DoomSharp.slnx

      - name: Build (enforce zero warnings)
        run: dotnet build DoomSharp/DoomSharp.slnx --no-restore --configuration Release /warnaserror

      - name: Test
        run: dotnet test DoomSharp/DoomSharp.slnx --no-build --configuration Release
